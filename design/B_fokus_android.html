<script>
(function () {
  var root = document.documentElement, mq = matchMedia("(prefers-color-scheme: dark)");
  function set(mode) {
    root.dataset.theme = mode === "system" ? (mq.matches ? "dark" : "light") : mode;
    document.querySelectorAll("[data-set-theme]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.setTheme === mode)); });
  }
  document.addEventListener("click", function (e) { var b = e.target.closest("[data-set-theme]"); if (b) set(b.dataset.setTheme); });
  set("system");
})();
</script>
